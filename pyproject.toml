[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zkm-deobfuscator"
version = "1.0.0"
description = "Static deobfuscator for Zelix KlassMaster protected jars"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "DarkCreative1" }]
keywords = ["zkm", "zelix", "klassmaster", "deobfuscator", "java", "jar", "reverse-engineering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Java",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = []

[project.optional-dependencies]
fast = ["pycryptodome>=3.19"]

[project.urls]
Homepage = "https://github.com/DarkCreative1/zkm-deobfuscator"
Source = "https://github.com/DarkCreative1/zkm-deobfuscator"
Issues = "https://github.com/DarkCreative1/zkm-deobfuscator/issues"

[tool.setuptools]
packages = ["zkm_deobfuscator"]
