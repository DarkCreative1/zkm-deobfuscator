plugins {
    id 'java'
    id 'application'
}

group = 'io.github.DarkCreative1'
version = '1.0.0'
description = 'Static deobfuscator for Zelix KlassMaster protected jars'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation files('lib/asm-9.8.jar', 'lib/asm-tree-9.8.jar', 'lib/asm-commons-9.8.jar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    failOnError = false
}

application {
    mainClass = 'com.zkmdeobf.Main'
}

tasks.named('test') {
    enabled = false
}

tasks.register('corpusTest', JavaExec) {
    group = 'verification'
    description = 'Runs the Java assertion suite (AllTests) over the bundled corpus.'
    dependsOn tasks.named('compileTestJava')
    mainClass = 'com.zkmdeobf.AllTests'
    classpath = sourceSets.test.runtimeClasspath
}

tasks.register('pyTest', Exec) {
    group = 'verification'
    description = 'Runs the Python analysis test suite.'
    dependsOn tasks.named('classes'), tasks.named('testClasses')
    workingDir = projectDir
    commandLine 'python', 'scripts/run_python_tests.py'
}

def corpusSets = ['demo1-zkm27', 'demo2-zkm27', 'demo3-zkm27',
                 'demo1-zkm13', 'demo2-zkm13', 'demo3-zkm13']

corpusSets.each { s ->
    tasks.register("deobfuscate${s.replace('-', '')}", JavaExec) {
        group = 'build'
        description = "Regenerates the deobfuscated jar for corpus set ${s}."
        dependsOn tasks.named('classes')
        mainClass = 'com.zkmdeobf.Main'
        classpath = sourceSets.main.runtimeClasspath
        def dir = file("corpus/jars/${s}")
        def inJar = dir.toPath().resolve('obf.jar')
        def outJar = dir.toPath().resolve('deobf.jar')
        def mapFile = file("corpus/changelogs/${s}.txt")
        args = [inJar.toString(), '-o', outJar.toString(), '--map', mapFile.toString()]
    }
}

tasks.register('deobfuscateAll') {
    group = 'build'
    description = 'Regenerates every deobfuscated corpus jar from its obfuscated input.'
    dependsOn corpusSets.collect { "deobfuscate${it.replace('-', '')}" }
}

tasks.named('check') {
    dependsOn 'corpusTest'
    dependsOn 'pyTest'
}

def asmJars = configurations.runtimeClasspath

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Builds a single self-contained runnable jar with ASM bundled in.'
    dependsOn tasks.named('classes')
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Main-Class': 'com.zkmdeobf.Main',
            'Implementation-Title': 'zkm-deobfuscator',
            'Implementation-Version': project.version,
            'Build-Jdk-Spec': '17'
        )
    }
    from sourceSets.main.output
    from({
        asmJars.collect { zipTree(it) }
    }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF'
        exclude 'module-info.class', 'META-INF/versions/*/module-info.class'
    }
}

tasks.register('smokeTestFatJar', JavaExec) {
    group = 'verification'
    description = 'Runs the bundled corpus through the fat jar to prove it is self-contained.'
    dependsOn tasks.named('fatJar')
    mainClass = 'com.zkmdeobf.Main'
    classpath = files(tasks.named('fatJar').flatMap { it.archiveFile })
    def f = tasks.named('fatJar').flatMap { it.archiveFile }
    def tmp = layout.buildDirectory.file('fatjar-smoke')
    outputs.dir(tmp)
    doFirst {
        def out = tmp.get().asFile
        out.mkdirs()
        args = ['corpus/fixtures/demo3D-obf.jar', '-o', new File(out, 'smoke.jar').path]
    }
}
