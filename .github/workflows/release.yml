name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v1.0.0'
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag must look like v1.2.3, got '$tag'"; exit 1 ;;
          esac
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $tag (version $version)"

      - name: Align the project version with the tag
        run: |
          set -euo pipefail
          expected='${{ steps.version.outputs.version }}'
          actual=$(./gradlew properties --no-daemon -q -Pversion="$expected" \
                    | sed -n 's/^version: //p' | head -1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::build.gradle reports version '$actual' but the tag is '$expected'"
            exit 1
          fi
          echo "build.gradle version is $actual"

      - name: Build and verify
        run: |
          set -euo pipefail
          ./gradlew build --no-daemon "-Pversion=${{ steps.version.outputs.version }}"
          java -Xmx3g -cp "build/classes/java/main:build/classes/java/test:lib/asm-9.8.jar:lib/asm-tree-9.8.jar:lib/asm-commons-9.8.jar" \
               com.zkmdeobf.AllTests

      - name: Build the runnable jar
        run: |
          set -euo pipefail
          ./gradlew fatJar smokeTestFatJar --no-daemon "-Pversion=${{ steps.version.outputs.version }}"
          ls -l build/libs/*-all.jar

      - name: Verify the jar is self-contained
        run: |
          set -euo pipefail
          jar=$(ls build/libs/*-all.jar)
          unzip -p "$jar" META-INF/MANIFEST.MF | grep -q 'Main-Class: com.zkmdeobf.Main'
          unzip -l "$jar" | grep -q 'org/objectweb/asm/ClassReader.class'
          mkdir -p /tmp/jarcheck
          java -jar "$jar" corpus/fixtures/demo3D-obf.jar -o /tmp/jarcheck/out.jar
          test -s /tmp/jarcheck/out.jar
          echo "The jar runs standalone on JDK 17"

      - name: Switch to JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run the jar on JDK 21
        run: |
          set -euo pipefail
          jar=$(ls build/libs/*-all.jar)
          java -jar "$jar" corpus/fixtures/demo3D-obf.jar -o /tmp/jarcheck/out21.jar
          test -s /tmp/jarcheck/out21.jar
          echo "The jar runs standalone on JDK 21"

      - name: Package the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/libs/*-all.jar
            LICENSE
            README.md

      - name: Write release notes
        if: always()
        run: |
          {
            echo "### Artifacts"
            echo ""
            echo "The runnable jar is \`zkm-deobfuscator-${{ steps.version.outputs.version }}-all.jar\`."
            echo ""
            echo "It is self-contained: ASM is bundled and it needs a JRE 17 or newer."
            echo ""
            echo '```bash'
            echo "java -jar zkm-deobfuscator-${{ steps.version.outputs.version }}-all.jar input.jar -o output.jar"
            echo '```'
            echo ""
            echo "Verified on JDK 17 and JDK 21, against the bundled six-jar corpus."
          } >> "$GITHUB_STEP_SUMMARY"
