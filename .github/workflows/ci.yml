name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Java assertion suite
        run: |
          set +e
          java -Xmx3g -cp "build/classes/java/main:build/classes/java/test:lib/asm-9.8.jar:lib/asm-tree-9.8.jar:lib/asm-commons-9.8.jar" \
               com.zkmdeobf.AllTests > /tmp/java-tests.log 2>&1
          rc=$?
          tail -3 /tmp/java-tests.log
          if [ "$rc" -ne 0 ]; then
            echo ""
            echo "FAILURE-DETAIL:"
            tail -c 1200 /tmp/java-tests.log | tr '\n' '~' | sed 's/~/ | /g'
            echo ""
          fi
          exit $rc

      - name: Python test suite
        run: |
          ./gradlew pyTest --no-daemon > /tmp/py-tests.log 2>&1 \
            || { echo "===== py-tests.log (tail) ====="; tail -40 /tmp/py-tests.log; exit 1; }
          tail -10 /tmp/py-tests.log

      - name: Independent corpus verification
        run: |
          set +e
          python scripts/verify_corpus.py > /tmp/verify.log 2>&1
          rc=$?
          tail -12 /tmp/verify.log
          if [ "$rc" -ne 0 ]; then
            echo ""
            echo "FAILURE-DETAIL:"
            tail -c 1200 /tmp/verify.log | tr '\n' '~' | sed 's/~/ | /g'
            echo ""
          fi
          exit $rc

      - name: Corpus inventory
        if: always()
        run: |
          {
            echo "### bundled corpus"
            echo "| set | classes |"
            echo "| --- | --- |"
            for j in corpus/jars/*/obf.jar; do
              n=$(unzip -l "$j" | grep -c '\.class$')
              echo "| $(dirname "$j" | xargs basename) | $n |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  third-party-jars:
    name: Real-world jar smoke test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        run: ./gradlew compileJava --no-daemon

      - name: Download a third-party jar
        run: |
          mkdir -p /tmp/thirdparty
          curl -fsSL -o /tmp/thirdparty/commons-io.jar \
            https://repo1.maven.org/maven2/commons-io/commons-io/2.15.1/commons-io-2.15.1.jar
          ls -l /tmp/thirdparty/commons-io.jar

      - name: Deobfuscate
        run: |
          set +e
          java -Xmx3g -cp "build/classes/java/main:lib/asm-9.8.jar:lib/asm-tree-9.8.jar:lib/asm-commons-9.8.jar" \
               com.zkmdeobf.Main /tmp/thirdparty/commons-io.jar -o /tmp/thirdparty/out.jar \
               > /tmp/deob.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "===== deob.log ====="
            cat /tmp/deob.log
            exit "$rc"
          fi
          cat /tmp/deob.log

      - name: Assert the output is valid
        run: |
          grep -q '^verify: OK' /tmp/deob.log \
            || { echo "expected 'verify: OK' in the deobfuscator output"; exit 1; }
          test -s /tmp/thirdparty/out.jar \
            || { echo "output jar is missing or empty"; exit 1; }
          before=$(unzip -l /tmp/thirdparty/commons-io.jar | grep -c '\.class$')
          after=$(unzip -l /tmp/thirdparty/out.jar | grep -c '\.class$')
          echo "classes: $before in, $after out"
          test "$before" = "$after" \
            || { echo "class count changed: $before -> $after"; exit 1; }
