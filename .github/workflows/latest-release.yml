name: Latest release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  latest:
    name: Build and publish latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build and test
        run: |
          set -euo pipefail
          ./gradlew build --no-daemon
          java -Xmx3g -cp "build/classes/java/main:build/classes/java/test:lib/asm-9.8.jar:lib/asm-tree-9.8.jar:lib/asm-commons-9.8.jar" \
               com.zkmdeobf.AllTests

      - name: Build the runnable jar
        run: |
          set -euo pipefail
          ./gradlew fatJar smokeTestFatJar --no-daemon
          ls -l build/libs/*-all.jar

      - name: Verify the jar is self-contained
        run: |
          set -euo pipefail
          jar=$(ls build/libs/*-all.jar)
          unzip -p "$jar" META-INF/MANIFEST.MF | grep -q 'Main-Class: com.zkmdeobf.Main'
          unzip -l "$jar" | grep -q 'org/objectweb/asm/ClassReader.class'
          mkdir -p /tmp/jarcheck
          java -jar "$jar" corpus/fixtures/demo3D-obf.jar -o /tmp/jarcheck/out.jar
          test -s /tmp/jarcheck/out.jar

      - name: Move latest tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            Automatic latest build from the `main` branch.

            Commit: `${{ github.sha }}`
          files: |
            build/libs/*-all.jar
            LICENSE
            README.md
